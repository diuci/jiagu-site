<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>画甲骨 · 丢词夺理</title>
    <meta name="description" content="看今字，画它的甲骨形；也可以看甲骨形猜字。同一天所有人同一题。" />
    <meta name="theme-color" content="#f4ede0" />
    <!-- 首帧之前定色（规范 §4）：暗色用户先看到夜墨，不闪白屏。
         同时给 html.dark，给 CSS 的 dark: 变体用。 -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('dc-theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark')
            document.documentElement.classList.add('dark')
            var m = document.querySelector('meta[name="theme-color"]')
            if (m) m.setAttribute('content', '#17140f')
          }
        } catch (e) {}
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
