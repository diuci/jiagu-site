name: 构建并部署甲骨猜字

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 检查器自检
        # 先证明检查本身会失败。空过的检查比没有检查更危险。
        run: npm run selftest

      - name: 盘面与快照
        # check:corpus（快照 vs 内容仓）是本地推送前的检查：CI 不检出内容仓，跑不了。
        # 这里只校验已提交快照的内部自洽（check:puzzle）。
        run: |
          npm run check:puzzle
          npm run check:draw

      - name: 构建
        run: npm run build

      - name: 法律护栏
        run: npm run check:legal

      - name: UI 闸门
        # 令牌与主站一致、CSS 不得把令牌色值抄成字面量。
        run: npm run check:ui

      - name: 产物体检
        run: npm run check:build

      - name: 冒烟：真开浏览器把当天这字猜到底
        run: |
          npm run preview -- --port 4173 --host 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4173/ >/dev/null
          node tools/smoke.mjs --url=http://127.0.0.1:4173

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
