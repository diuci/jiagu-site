name: 校验分站（branch 模式，不碰发布）

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 装依赖
        run: npm ci

      - name: 检查器自检
        run: npm run selftest

      - name: 构建
        run: npm run build

      - name: 盘面与快照
        # check:corpus（快照 vs 内容仓）是本地推送前的检查：CI 不检出内容仓，跑不了。
        # 这里只校验已提交快照的内部自洽（check:puzzle）。
        run: |
          npm run check:puzzle
          npm run check:legal
          npm run check:build
          npm run check:ui
