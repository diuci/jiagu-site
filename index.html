    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>画甲骨 · 丢词夺理</title>
    <meta name="description" content="看今字，画它的甲骨形；也可以看甲骨形猜字。每天打开练一个。" />
    <meta name="theme-color" content="#f4ede0" />
    <!-- 首帧之前定色（规范 §4）：暗色用户先看到夜墨，不闪白屏。
         脚本与 _deploy/core/theme.mjs 的 BOOTSTRAP 同源（check-core R4 钉特征）。 -->
    <script>
      ;(function () {
        var t = document.documentElement
        var saved = null
        try { saved = localStorage.getItem('dc-theme') } catch (e) {}
        var mode = saved === 'dark' || saved === 'light'
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        t.setAttribute('data-theme', mode)
        t.classList.toggle('dark', mode === 'dark')
        t.classList.toggle('light', mode === 'light')
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', mode === 'dark' ? '#17140f' : '#f4ede0')
      })();
    </script>
    <!-- 字体与主站同一套（缺了它圆体/衬线全回退系统字体，顶栏一眼就不是一家）：
         Noto Serif SC 正文衬线、ZCOOL KuaiLe 站名/印章/圆钮、ZCOOL XiaoWei 楷体。 -->
